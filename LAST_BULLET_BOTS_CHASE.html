
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST BULLET</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9dc;font-family:Arial;color:white}
canvas{display:block}
#menu,#pause,#shop{
 position:fixed;inset:0;z-index:5;display:flex;align-items:center;
 justify-content:center;background:linear-gradient(120deg,#111d26dd,#263b45cc);
}
.panel{background:#17232bee;border:2px solid #8d9b9b;padding:30px;
 width:min(430px,92vw);text-align:center;border-radius:8px}
h1{font-size:44px;margin:0 0 8px;color:#e3b75d;letter-spacing:4px}
button{display:block;width:100%;padding:13px;margin:10px 0;
 background:#b78a43;color:#fff;border:0;border-radius:4px;
 font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#d4a755}
.small{color:#c5d0d3;font-size:13px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2;display:none}
#stats{position:absolute;left:18px;bottom:18px;background:#111bdf;
 background:#101820dd;padding:12px 18px;border:1px solid #84949a}
#money{position:absolute;right:20px;top:18px;background:#101820dd;
 padding:12px;color:#eac36a;font-size:20px}
#crosshair{position:absolute;left:50%;top:50%;font-size:27px;
 transform:translate(-50%,-50%);text-shadow:0 0 4px black}
#slots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
 display:flex;gap:5px}
.slot{background:#15212ddd;border:2px solid #89949a;padding:10px;
 min-width:76px;text-align:center;font-size:12px}
.slot.active{border:2px solid #edc35d;background:#554326dd}
#help{position:absolute;top:15px;left:18px;background:#101820bb;padding:9px;font-size:12px}
#message{position:absolute;top:18%;left:50%;transform:translateX(-50%);
 font-size:24px;color:#ffe18a;text-shadow:2px 2px 3px black}
#shop{display:none}
#pause{display:none}
#damage{position:absolute;inset:0;border:0 solid #d22;transition:border .1s}
</style>
</head>
<body>

<div id="menu">
 <div class="panel">
  <h1>LAST BULLET</h1>
  <p>TACTICAL OFFLINE ARENA</p>
  <p class="small">CS 1.6 inspired • Desert map • Survival</p>
  <button onclick="startGame()">OFFLINE GAME</button>
  <button onclick="showOnline()">ONLINE GAME</button>
  <button onclick="openShop()">SHOP</button>
  <p class="small">WASD • Mouse • Click • ESC</p>
  <p class="small" id="menuNote"></p>
 </div>
</div>

<div id="pause">
 <div class="panel">
  <h1>PAUSED</h1>
  <button onclick="resumeGame()">CONTINUE</button>
  <button onclick="openShop()">SHOP</button>
  <button onclick="backMenu()">MAIN MENU</button>
 </div>
</div>

<div id="shop">
 <div class="panel">
  <h1>SHOP</h1>
  <p id="shopMoney">Money: 5000€</p>
  <button onclick="buy('Blaster',0)">Blaster — FREE</button>
  <button onclick="buy('Pulse',700)">Pulse — 700€</button>
  <button onclick="buy('Plasma',1500)">Plasma — 1500€</button>
  <button onclick="buy('Medkit',500)">Medkit — 500€</button>
  <button onclick="closeShop()">BACK</button>
  <p class="small">Fictional arcade equipment</p>
 </div>
</div>

<div id="hud">
 <div id="help">WASD: kretanje | Mouse: pogled | Klik: pucaj | ESC: pauza</div>
 <div id="money">5000€</div>
 <div id="crosshair">+</div>
 <div id="message"></div>
 <div id="stats">HP: <span id="hp">100</span> | KILLS: <span id="kills">0</span></div>
 <div id="slots">
  <div class="slot active" id="slot0">1<br>Blaster</div>
  <div class="slot" id="slot1">2<br>Pulse</div>
  <div class="slot" id="slot2">3<br>Plasma</div>
  <div class="slot" id="slot3">4<br>Medkit</div>
 </div>
 <div id="damage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,clock;
let player={x:0,z:12,hp:100,money:5000,kills:0};
let bots=[],obstacles=[],keys={},items=['Blaster','Pulse','Plasma','Medkit'];
let owned={Blaster:true,Pulse:false,Plasma:false,Medkit:false};
let selected=0,active=false,started=false,shopReturn='menu';
let yaw=0,pitch=0,lastShot=0,gameOver=false;
const $=id=>document.getElementById(id);

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x78b5e3);
 scene.fog=new THREE.Fog(0x9bb8c9,85,190);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
 camera.position.set(0,1.7,12);
 renderer=new THREE.WebGLRenderer({antialias:false});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
 renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.shadowMap.enabled=false;
 document.body.appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xdcecff,0x665744,0.85));
 let sun=new THREE.DirectionalLight(0xffe2b0,1.15);
 sun.position.set(-25,45,20);scene.add(sun);

 const mat=(c)=>new THREE.MeshLambertMaterial({color:c});
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),mat(0x9a896b));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);

 // Road and map markings
 let road=new THREE.Mesh(new THREE.PlaneGeometry(18,100),mat(0x454747));
 road.rotation.x=-Math.PI/2;road.position.set(0,.005,-8);scene.add(road);
 for(let z=-50;z<40;z+=9){
  let line=new THREE.Mesh(new THREE.PlaneGeometry(.18,4),mat(0xd0b879));
  line.rotation.x=-Math.PI/2;line.position.set(0,.02,z);scene.add(line);
 }
 function box(x,y,z,w,h,d,color,solid=true){
  let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  m.position.set(x,y,z);scene.add(m);
  if(solid)obstacles.push({x,z,w,d});
  return m;
 }
 // Buildings
 const buildings=[
 [-22,0,-25,15,12,19], [22,0,-25,16,13,20],
 [-25,0,5,14,10,18],[25,0,6,15,12,19],
 [-10,0,-48,19,11,12],[12,0,-48,19,12,12],
 [-40,0,-10,12,14,24],[40,0,-12,12,13,24]
 ];
 for(let b of buildings){
  box(b[0],b[4]/2,b[2],b[3],b[4],b[5],0xc5ad83);
  // roof edge
  box(b[0],b[4]+.2,b[2],b[3]+.4,.4,b[5]+.4,0x79664e,false);
  for(let side of [-1,1]){
   for(let y=2.7;y<b[4]-1;y+=3){
    let win=box(b[0]+side*(b[3]/2+.015),y,b[2],.05,1.2,1.6,0x263b49,false);
   }
  }
 }
 // Concrete walls and cover
 box(0,1,-31,12,2,1,0x777b78);
 box(-8,1,-9,1,2,13,0x777b79);
 box(9,1,0,1,2,12,0x777b79);
 box(0,.8,25,22,1.6,1,0x777b79);
 // Crates and barrels
 for(let i=0;i<13;i++){
  let x=(Math.random()-.5)*55,z=-38+Math.random()*65;
  if(Math.abs(x)<5&&z>0)continue;
  box(x,.8,z,1.6,1.6,1.6,0x805332);
 }
 for(let i=0;i<8;i++){
  let x=(Math.random()-.5)*50,z=-35+Math.random()*65;
  let cyl=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,1.2,10),mat(0x596166));
  cyl.position.set(x,.6,z);scene.add(cyl);
  obstacles.push({x,z,w:1,d:1});
 }
 // Green ground patches
 for(let i=0;i<18;i++){
  let patch=new THREE.Mesh(new THREE.CircleGeometry(2+Math.random()*2,8),mat(i%2?0x536b3b:0x647a45));
  patch.rotation.x=-Math.PI/2;
  patch.position.set((Math.random()-.5)*115,-.045,-45+Math.random()*90);
  scene.add(patch);
 }
 // Palm trees
 for(let i=0;i<12;i++){
  let x=(Math.random()-.5)*75,z=-45+Math.random()*80;
  let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,3.5,7),mat(0x765039));
  trunk.position.set(x,1.75,z);scene.add(trunk);
  for(let a=0;a<6;a++){
   let leaf=new THREE.Mesh(new THREE.BoxGeometry(.35,.12,3.2),mat(0x3d7138));
   leaf.position.set(x,3.6,z);leaf.rotation.y=a*Math.PI/3;leaf.rotation.x=-.15;scene.add(leaf);
  }
 }
 createBots(7);
 animate();
}

function createBots(n){
 for(let i=0;i<n;i++){
  let g=new THREE.Group();
  let body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.1,.45),new THREE.MeshLambertMaterial({color:0x526b43}));
  body.position.y=1.1;g.add(body);
  let head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.5),new THREE.MeshLambertMaterial({color:0xb99570}));
  head.position.y=1.95;g.add(head);
  let legs=new THREE.Mesh(new THREE.BoxGeometry(.65,.75,.4),new THREE.MeshLambertMaterial({color:0x343b38}));
  legs.position.y=.35;g.add(legs);
  let bar=new THREE.Group();
  let bg=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.13),new THREE.MeshBasicMaterial({color:0x222222}));
  let fg=new THREE.Mesh(new THREE.PlaneGeometry(1,.09),new THREE.MeshBasicMaterial({color:0x36dc4e}));
  fg.position.z=.01;bar.add(bg,fg);bar.position.y=2.65;g.add(bar);
  g.userData={hp:100,maxHp:100,bar,fg,hit:0,attack:0,waypoint:0};
  // Spawn bots on open ground, not inside buildings or crates
  let sx=0,sz=-20,tries=0;
  do{
   sx=(Math.random()-.5)*48;
   sz=-35+Math.random()*55;
   tries++;
  }while((blocked(sx,sz)||Math.hypot(sx-camera.position.x,sz-camera.position.z)<10)&&tries<100);
  g.position.set(sx,0,sz);
  scene.add(g);bots.push(g);
 }
}

function startGame(){
 if(!scene)init();
 $('menu').style.display='none';$('pause').style.display='none';
 $('shop').style.display='none';$('hud').style.display='block';
 active=true;started=true;gameOver=false;
 if(player.hp<=0){player.hp=100;player.x=0;player.z=12;camera.position.set(0,1.7,12)}
 camera.position.set(player.x,1.7,player.z);
 document.body.requestPointerLock?.();
 updateHud();
}
function showOnline(){ $('menuNote').textContent='Online multiplayer zahteva poseban server. Trenutno možeš igrati Offline.';}
function pauseGame(){
 if(!active)return;active=false;
 $('pause').style.display='flex';document.exitPointerLock?.();
}
function resumeGame(){
 $('pause').style.display='none';active=true;document.body.requestPointerLock?.();
}
function backMenu(){
 active=false;$('pause').style.display='none';$('hud').style.display='none';
 $('menu').style.display='flex';document.exitPointerLock?.();
}
function openShop(){
 shopReturn=active?'pause':'menu';active=false;
 $('shopMoney').textContent='Money: '+player.money+'€';
 $('shop').style.display='flex';document.exitPointerLock?.();
}
function closeShop(){
 $('shop').style.display='none';
 if(shopReturn==='pause')$('pause').style.display='flex';
 else $('menu').style.display='flex';
}
function buy(name,cost){
 if(owned[name]){$('shopMoney').textContent=name+' je već kupljen!';return}
 if(player.money<cost){$('shopMoney').textContent='Nemaš dovoljno novca!';return}
 player.money-=cost;owned[name]=true;
 $('shopMoney').textContent='Kupljeno: '+name+' | '+player.money+'€';
 updateHud();
}
function updateHud(){
 $('hp').textContent=Math.max(0,Math.round(player.hp));
 $('kills').textContent=player.kills;
 $('money').textContent=player.money+'€';
 for(let i=0;i<4;i++)$('slot'+i).classList.toggle('active',i===selected);
}
function selectSlot(n){
 selected=n;
 if(!owned[items[n]]){$('message').textContent='Prvo kupi '+items[n]+' u SHOP-u';setTimeout(()=>$('message').textContent='',1300);selected=0}
 updateHud();
}
function shoot(){
 if(!active||!document.pointerLockElement)return;
 let now=performance.now();if(now-lastShot<260)return;lastShot=now;
 if(items[selected]==='Medkit'){
  if(owned.Medkit&&player.hp<100){player.hp=Math.min(100,player.hp+35);owned.Medkit=false;updateHud()}
  return;
 }
 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 let targets=[];
 bots.forEach(b=>b.traverse(o=>{if(o.isMesh)targets.push(o)}));
 let hits=ray.intersectObjects(targets,false);
 if(hits.length){
  let bot=bots.find(b=>{let found=false;b.traverse(o=>{if(o===hits[0].object)found=true});return found});
  if(bot){
   let damage=selected===2?65:selected===1?35:25;
   bot.userData.hp-=damage;
   if(bot.userData.hp<=0){
    scene.remove(bot);bots=bots.filter(x=>x!==bot);
    player.kills++;player.money+=500;
    if(bots.length<5)createBots(3);
    $('message').textContent='+500€';
    setTimeout(()=>$('message').textContent='',900);
   }else{
    bot.userData.fg.scale.x=Math.max(.01,bot.userData.hp/100);
   }
   updateHud();
  }
 }
}
function blocked(x,z){
 for(let o of obstacles){
  if(Math.abs(x-o.x)<o.w/2+.55&&Math.abs(z-o.z)<o.d/2+.55)return true;
 }
 return false;
}
function botMove(bot,dt){
 // Bots actively chase the player and steer around walls/crates.
 let dx=camera.position.x-bot.position.x;
 let dz=camera.position.z-bot.position.z;
 let dist=Math.hypot(dx,dz);

 if(dist>2.4){
  const speed=3.0*dt;
  const ux=dx/(dist||1), uz=dz/(dist||1);

  // Try several directions; choose the open direction that gets closest
  // to the player. This prevents bots from endlessly pushing into walls.
  const angles=[0,0.45,-0.45,0.9,-0.9,1.35,-1.35,Math.PI];
  let best=null, bestScore=Infinity;

  for(const a of angles){
   const ca=Math.cos(a), sa=Math.sin(a);
   const vx=(ux*ca-uz*sa), vz=(ux*sa+uz*ca);
   const nx=bot.position.x+vx*speed;
   const nz=bot.position.z+vz*speed;
   if(blocked(nx,nz))continue;

   const remaining=Math.hypot(camera.position.x-nx,camera.position.z-nz);
   // Small preference for continuing in a steady direction
   const score=remaining + Math.abs(a)*0.12;
   if(score<bestScore){bestScore=score;best={x:nx,z:nz,vx,vz};}
  }

  if(best){
   bot.position.x=best.x;
   bot.position.z=best.z;
   bot.rotation.y=Math.atan2(best.vx,best.vz);
  }
 }else if(performance.now()-bot.userData.attack>1100){
  bot.userData.attack=performance.now();
  player.hp-=7;
  $('damage').style.border='12px solid #d22';
  setTimeout(()=>$('damage').style.border='0 solid #d22',130);
  updateHud();

  if(player.hp<=0){
   player.hp=0;active=false;
   $('pause').style.display='flex';
   $('pause').querySelector('h1').textContent='GAME OVER';
  }
 }
}
function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.04);
 if(active){
  let speed=7*dt;
  let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let move=new THREE.Vector3();
  if(keys.KeyW)move.add(forward);
  if(keys.KeyS)move.sub(forward);
  if(keys.KeyD)move.add(right);
  if(keys.KeyA)move.sub(right);
  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(speed);
   let nx=camera.position.x+move.x,nz=camera.position.z+move.z;
   if(!blocked(nx,camera.position.z))camera.position.x=nx;
   if(!blocked(camera.position.x,nz))camera.position.z=nz;
  }
  player.x=camera.position.x;player.z=camera.position.z;
  bots.forEach(b=>botMove(b,dt));
 }
 bots.forEach(b=>{
  b.userData.bar.quaternion.copy(camera.quaternion);
  b.userData.bar.position.y=2.65;
 });
 renderer.render(scene,camera);
}
document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='Escape'&&active)pauseGame();
 if(e.code==='Digit1')selectSlot(0);
 if(e.code==='Digit2')selectSlot(1);
 if(e.code==='Digit3')selectSlot(2);
 if(e.code==='Digit4')selectSlot(3);
});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{
 if(!active||!document.pointerLockElement)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
});
document.addEventListener('mousedown',e=>{if(e.button===0)shoot()});
document.addEventListener('pointerlockchange',()=>{
 if(!document.pointerLockElement&&active)pauseGame();
});
addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
